<svg width="1400" height="280" viewBox="0 0 1400 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    
    <linearGradient id="mainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5b8cff"/>
      <stop offset="50%" stop-color="#355cff"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>

    
    <radialGradient id="glowTL" cx="0%" cy="0%" r="60%" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#a8c4ff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#a8c4ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBR" cx="100%" cy="100%" r="55%" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#7aa2ff" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#7aa2ff" stop-opacity="0"/>
    </radialGradient>

    
    <clipPath id="textClip">
      <text x="270" y="168" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="108" font-weight="600" letter-spacing="-2">Documentation</text>
    </clipPath>

    
    <linearGradient id="s1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5b8cff"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="s2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7aa2ff"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="s3" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#5b8cff"/>
      <stop offset="100%" stop-color="#355cff"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  
  <g transform="translate(40,40) scale(0.390625)">
    <g transform="translate(-179.22,-136.73) scale(1.1483)">
      <path d="M 371 180 A 90 90 0 1 1 309 180" fill="none" stroke="url(#s1)" stroke-width="23" stroke-linecap="round" filter="url(#glow)"/>
      <path d="M 275 283 A 90 90 0 1 1 197 328" fill="none" stroke="url(#s2)" stroke-width="23" stroke-linecap="round" filter="url(#glow)"/>
      <path d="M 483 328 A 90 90 0 1 1 405 463" fill="none" stroke="url(#s3)" stroke-width="23" stroke-linecap="round" filter="url(#glow)"/>
      
      <path d="M 371 180 A 90 90 0 1 1 309 180" fill="none" stroke="#a8c4ff" stroke-width="0.7" stroke-linecap="round" opacity="0.5"/>
      <path d="M 275 283 A 90 90 0 1 1 197 328" fill="none" stroke="#a8c4ff" stroke-width="0.7" stroke-linecap="round" opacity="0.5"/>
      <path d="M 483 328 A 90 90 0 1 1 405 463" fill="none" stroke="#a8c4ff" stroke-width="0.7" stroke-linecap="round" opacity="0.5"/>
      
      <circle cx="371" cy="180" r="4" fill="#5b8cff" opacity="0.9"/>
      <circle cx="309" cy="180" r="4" fill="#5b8cff" opacity="0.9"/>
      <circle cx="275" cy="283" r="4" fill="#7aa2ff" opacity="0.9"/>
      <circle cx="197" cy="328" r="4" fill="#7aa2ff" opacity="0.9"/>
      <circle cx="483" cy="328" r="4" fill="#355cff" opacity="0.9"/>
      <circle cx="405" cy="463" r="4" fill="#355cff" opacity="0.9"/>
    </g>
  </g>

  
  <rect width="1400" height="280" fill="url(#mainGrad)" clip-path="url(#textClip)"/>
  <rect width="1400" height="280" fill="url(#glowTL)" clip-path="url(#textClip)"/>
  <rect width="1400" height="280" fill="url(#glowBR)" clip-path="url(#textClip)"/>
</svg>
