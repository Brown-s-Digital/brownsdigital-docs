name: php-lint

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.4"
          coverage: none
      - name: Lint PHP files
        run: |
          set -euo pipefail
          mapfile -t files < <(find . -type f -name '*.php' \
            ! -path './vendor/*' \
            ! -path './node_modules/*' \
            ! -path './sites/*' \
            ! -path './.git/*' \
            | sort)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No PHP files to lint."
            exit 0
          fi
          echo "Linting ${#files[@]} PHP files..."
          fail=0
          for f in "${files[@]}"; do
            php -l "$f" || fail=1
          done
          exit "$fail"
