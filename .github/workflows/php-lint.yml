name: php-lint

on:
  pull_request:
  push:

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
      - name: Lint PHP files
        run: |
          set -euo pipefail
          mapfile -t files < <(find . -type f -name '*.php' \
            ! -path './vendor/*' \
            ! -path './node_modules/*' \
            ! -path './sites/*' \
            ! -path './.git/*' \
            | sort)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No PHP files to lint."
            exit 0
          fi
          echo "Linting ${#files[@]} PHP files..."
          fail=0
          for f in "${files[@]}"; do
            php -l "$f" || fail=1
          done
          exit "$fail"
